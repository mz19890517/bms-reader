name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BMS_KEYSTORE_B64: ${{ secrets.BMS_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # 固定签名密钥解码到 worksapce 外的 /tmp,不留在产物目录
      - name: 准备签名密钥
        run: |
          echo "$BMS_KEYSTORE_B64" | base64 -d > /tmp/bmsreader.keystore
          echo "BMS_KEYSTORE=/tmp/bmsreader.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装平台与构建工具
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle 8.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-tools"

      - name: 构建 debug APK
        run: |
          "$HOME/gradle-tools/gradle-8.6/bin/gradle" --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bms-reader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
