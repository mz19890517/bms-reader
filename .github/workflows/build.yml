name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-tools"

      - name: 构建 debug APK
        run: |
          "$HOME/gradle-tools/gradle-8.6/bin/gradle" --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bms-reader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
