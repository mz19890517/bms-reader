name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装平台与构建工具
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle 8.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-tools"

      - name: 构建 debug APK
        run: |
          "$HOME/gradle-tools/gradle-8.6/bin/gradle" --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bms-reader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
